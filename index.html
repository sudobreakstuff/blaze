<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>blaze 🌙</title>
<meta name="description" content="a little someone who thinks about you." />
<link rel="icon" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="day">
<div class="app">

  <div class="scene" id="scene">
    <div class="wall">
      <div class="wallpaper"></div>

      <div class="window" id="window">
        <div class="sky" id="sky"></div>
        <div class="cloud c1"></div><div class="cloud c2"></div>
        <div class="celestial" id="celestial"></div>
        <div class="stars" id="stars"></div>
        <div class="frame x"></div><div class="frame y"></div>
        <div class="sill"><div class="sill-plant"><i></i><i></i><i></i></div></div>
      </div>

      <div class="lights" id="lights"></div>

      <div class="frames">
        <div class="poster p1"><span>🌙</span><b>good<br>vibes</b></div>
        <div class="poster p2"><span>🧡</span></div>
      </div>

      <div class="shelf">
        <div class="books"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="jar"></div>
      </div>

      <div class="desk">
        <div class="monitor"></div>
        <div class="mug"></div>
        <div class="desk-top"></div>
        <div class="desk-leg l"></div><div class="desk-leg r"></div>
      </div>

    </div>

    <div class="floor">
      <div class="rug"></div>
      <div class="lamp" id="lamp"><div class="shade"></div><div class="glow"></div><div class="pole"></div><div class="base"></div></div>
      <div class="plant"><div class="pot"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div></div>
      <div class="bed">
        <div class="headboard"></div>
        <div class="pillow"></div>
        <div class="blanket"></div>
      </div>
      <div class="cat"><div class="cat-body"></div><div class="cat-head"></div><div class="cat-tail"></div></div>
    </div>

    <!-- ============ BLAZE ============ -->
    <svg id="blaze" class="blaze mood-idle" viewBox="0 0 220 330" xmlns="http://www.w3.org/2000/svg" aria-label="Blaze">
      <defs>
        <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff9a4a"/><stop offset="0.55" stop-color="#f2701f"/><stop offset="1" stop-color="#c94a12"/>
        </linearGradient>
        <linearGradient id="hairhi" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd79a"/><stop offset="1" stop-color="#ffab5c"/>
        </linearGradient>
        <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd98a"/><stop offset="0.5" stop-color="#ff9d3c"/><stop offset="1" stop-color="#b8430f"/>
        </linearGradient>
        <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe3cd"/><stop offset="1" stop-color="#f6c3a3"/>
        </linearGradient>
        <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3f6f7d"/><stop offset="1" stop-color="#2c4f5c"/>
        </linearGradient>
        <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#eaddcb"/>
        </linearGradient>
        <linearGradient id="jeans" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3c4a70"/><stop offset="1" stop-color="#28324f"/>
        </linearGradient>
        <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ff8fa6" stop-opacity="0.9"/><stop offset="1" stop-color="#ff8fa6" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse id="shadow" cx="110" cy="316" rx="44" ry="8" fill="#1a1020" opacity="0.22"/>

      <g id="blaze-root">
        <!-- ===== legs ===== -->
        <g class="leg leg-l" id="leg-l">
          <path d="M88 206 q-3 46 -2 76 l22 0 q2 -30 0 -76 z" fill="url(#jeans)"/>
          <path d="M89 208 q-2 20 -1 40 l8 0 q1 -20 0 -40 z" fill="#4a5a86" opacity="0.55"/>
          <path d="M79 280 q4 -8 12 -6 l20 0 q8 0 9 8 l0 6 q-22 4 -41 0 z" fill="#f7f3ec"/>
          <path d="M79 280 q4 -8 12 -6 l20 0 q6 0 8 4 l-1 3 q-20 3 -39 -1 z" fill="#e8562a"/>
          <rect x="76" y="292" width="46" height="7" rx="3.5" fill="#22222b"/>
        </g>
        <g class="leg leg-r" id="leg-r">
          <path d="M112 206 q2 46 0 76 l22 0 q3 -30 2 -76 z" fill="url(#jeans)"/>
          <path d="M113 208 q1 20 0 40 l8 0 q1 -20 0 -40 z" fill="#4a5a86" opacity="0.55"/>
          <path d="M109 280 q4 -8 12 -6 l20 0 q8 0 9 8 l0 6 q-22 4 -41 0 z" fill="#f7f3ec"/>
          <path d="M109 280 q4 -8 12 -6 l20 0 q6 0 8 4 l-1 3 q-20 3 -39 -1 z" fill="#e8562a"/>
          <rect x="106" y="292" width="46" height="7" rx="3.5" fill="#22222b"/>
        </g>

        <!-- ===== torso / jacket ===== -->
        <g id="torso">
          <path d="M78 126 q32 -12 64 0 l7 76 q-39 10 -78 0 z" fill="url(#tee)"/>
          <path d="M78 126 q-9 6 -10 18 l5 52 q8 5 17 7 l3 -70 z" fill="url(#jacket)"/>
          <path d="M142 126 q9 6 10 18 l-5 52 q-8 5 -17 7 l-3 -70 z" fill="url(#jacket)"/>
          <path d="M78 126 q-6 4 -9 11 q10 4 15 14 l2 -22 z" fill="#4f8290" opacity="0.8"/>
          <path d="M142 126 q6 4 9 11 q-10 4 -15 14 l-2 -22 z" fill="#4f8290" opacity="0.8"/>
          <path d="M99 128 q11 22 22 0 l0 10 q-11 14 -22 0 z" fill="#e8562a"/>
          <circle cx="110" cy="150" r="4" fill="#ffd08a" stroke="#e8562a" stroke-width="2"/>
          <path d="M110 150 q-2 14 -7 22" stroke="#e8562a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <line x1="95" y1="140" x2="95" y2="196" stroke="#22424e" stroke-width="2" opacity="0.6"/>
          <line x1="125" y1="140" x2="125" y2="196" stroke="#22424e" stroke-width="2" opacity="0.6"/>
        </g>

        <!-- ===== arms ===== -->
        <g class="arm" id="arm-l">
          <rect x="49" y="134" width="21" height="64" rx="10.5" fill="url(#jacket)"/>
          <rect x="49" y="134" width="21" height="22" rx="10.5" fill="#4f8290"/>
          <rect x="52" y="150" width="6" height="42" rx="3" fill="#22424e" opacity="0.4"/>
          <circle cx="59.5" cy="202" r="12" fill="url(#skin)"/>
        </g>
        <g class="arm" id="arm-r">
          <rect x="150" y="134" width="21" height="64" rx="10.5" fill="url(#jacket)"/>
          <rect x="150" y="134" width="21" height="22" rx="10.5" fill="#4f8290"/>
          <rect x="163" y="150" width="6" height="42" rx="3" fill="#22424e" opacity="0.4"/>
          <circle cx="160.5" cy="202" r="12" fill="url(#skin)"/>
        </g>

        <!-- ===== neck + head ===== -->
        <path d="M100 110 h20 v18 q-10 6 -20 0 z" fill="#e9b491"/>
        <g id="head">
          <path d="M68 76 q0 -42 42 -42 q42 0 42 42 q0 32 -9 50 q-9 -16 -8 -36 q-28 8 -58 0 q1 20 -8 36 q-9 -18 -9 -50 z" fill="url(#hair)"/>

          <path d="M110 34 q40 0 40 44 q0 40 -40 56 q-40 -16 -40 -56 q0 -44 40 -44 z" fill="url(#skin)"/>
          <path d="M110 34 q40 0 40 44 q0 8 -2 16 q-12 -18 -38 -18 q-26 0 -38 18 q-2 -8 -2 -16 q0 -44 40 -44 z" fill="#f3c3a2" opacity="0.5"/>
          <ellipse cx="66" cy="84" rx="6.5" ry="9" fill="#f6c3a3"/>
          <ellipse cx="154" cy="84" rx="6.5" ry="9" fill="#f6c3a3"/>

          <ellipse id="blush-l" cx="83" cy="101" rx="12" ry="7.5" fill="url(#blush)"/>
          <ellipse id="blush-r" cx="137" cy="101" rx="12" ry="7.5" fill="url(#blush)"/>

          <!-- fringe -->
          <path d="M69 74 q2 -38 41 -38 q39 0 41 38 q-9 -16 -22 -21 q-6 15 -16 19 q-3 -15 -9 -21 q-18 6 -35 23 z" fill="url(#hair)"/>
          <path d="M93 37 q20 -7 36 6 q-16 -5 -31 3 q-5 3 -5 -9 z" fill="url(#hairhi)" opacity="0.85"/>
          <path d="M86 42 q10 8 14 22" stroke="#ffbe78" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
          <path d="M130 40 q-6 12 -4 24" stroke="#c94a12" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>

          <g id="brows">
            <rect class="brow" id="brow-l" x="85" y="68" width="21" height="4.5" rx="2.2" fill="#a63c0d"/>
            <rect class="brow" id="brow-r" x="114" y="68" width="21" height="4.5" rx="2.2" fill="#a63c0d"/>
          </g>

          <g class="eyes eyes-normal">
            <g class="eye" id="eye-l">
              <ellipse cx="94" cy="85" rx="11.5" ry="13.5" fill="#fdfcff"/>
              <ellipse class="iris" cx="94" cy="86" rx="9.5" ry="11.5" fill="url(#iris)"/>
              <ellipse class="pupil" cx="94" cy="87" rx="4.8" ry="6.4" fill="#33170a"/>
              <ellipse cx="94" cy="83" rx="4.6" ry="5" fill="#b8430f" opacity="0.35"/>
              <circle cx="90.5" cy="80.5" r="3.3" fill="#fff"/>
              <circle cx="97.5" cy="92" r="1.7" fill="#fff" opacity="0.9"/>
              <rect class="lid" id="lid-l" x="82" y="70" width="25" height="30" fill="url(#skin)"/>
            </g>
            <g class="eye" id="eye-r">
              <ellipse cx="126" cy="85" rx="11.5" ry="13.5" fill="#fdfcff"/>
              <ellipse class="iris" cx="126" cy="86" rx="9.5" ry="11.5" fill="url(#iris)"/>
              <ellipse class="pupil" cx="126" cy="87" rx="4.8" ry="6.4" fill="#33170a"/>
              <ellipse cx="126" cy="83" rx="4.6" ry="5" fill="#b8430f" opacity="0.35"/>
              <circle cx="122.5" cy="80.5" r="3.3" fill="#fff"/>
              <circle cx="129.5" cy="92" r="1.7" fill="#fff" opacity="0.9"/>
              <rect class="lid" id="lid-r" x="114" y="70" width="25" height="30" fill="url(#skin)"/>
            </g>
          </g>

          <g class="eyes eyes-happy">
            <path d="M83 88 q11 -13 22 0" stroke="#33170a" stroke-width="4.2" fill="none" stroke-linecap="round"/>
            <path d="M115 88 q11 -13 22 0" stroke="#33170a" stroke-width="4.2" fill="none" stroke-linecap="round"/>
          </g>
          <g class="eyes eyes-love">
            <path d="M94 97 C81 86 83 73 94 80 C105 73 107 86 94 97 Z" fill="#ff5c8a"/>
            <path d="M126 97 C113 86 115 73 126 80 C137 73 139 86 126 97 Z" fill="#ff5c8a"/>
            <path d="M90 82 q4 -4 8 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
            <path d="M122 82 q4 -4 8 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
          </g>
          <g class="eyes eyes-closed">
            <path d="M82 85 q12 11 24 0" stroke="#33170a" stroke-width="4.2" fill="none" stroke-linecap="round"/>
            <path d="M114 85 q12 11 24 0" stroke="#33170a" stroke-width="4.2" fill="none" stroke-linecap="round"/>
          </g>
          <g class="eyes eyes-sad">
            <ellipse cx="94" cy="89" rx="9.5" ry="10.5" fill="#fdfcff"/>
            <ellipse cx="126" cy="89" rx="9.5" ry="10.5" fill="#fdfcff"/>
            <ellipse cx="94" cy="90" rx="7.4" ry="8.4" fill="#6b7fa6"/>
            <ellipse cx="126" cy="90" rx="7.4" ry="8.4" fill="#6b7fa6"/>
            <ellipse cx="94" cy="90" rx="3.5" ry="4.8" fill="#1f3049"/>
            <ellipse cx="126" cy="90" rx="3.5" ry="4.8" fill="#1f3049"/>
            <circle cx="91" cy="86" r="2.3" fill="#fff" opacity="0.9"/>
            <circle cx="123" cy="86" r="2.3" fill="#fff" opacity="0.9"/>
          </g>

          <g id="mouths">
            <path class="mouth mouth-idle" d="M104 107 q6 5 12 0" stroke="#9c4522" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path class="mouth mouth-smile" d="M100 105 q10 12 20 0" stroke="#9c4522" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path class="mouth mouth-grin" d="M98 105 q12 16 24 0 q-12 6 -24 0 z" fill="#b8471f"/>
            <ellipse class="mouth mouth-o" cx="110" cy="111" rx="6" ry="7.5" fill="#9c4522"/>
            <path class="mouth mouth-sad" d="M102 113 q8 -6 16 0" stroke="#9c4522" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path class="mouth mouth-smirk" d="M101 107 q11 9 21 3" stroke="#9c4522" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
        </g>

        <g id="prop" class="prop"></g>
      </g>
    </svg>

    <div class="hearts" id="hearts"></div>

    <div class="bubble" id="bubble" hidden>
      <div class="bubble-text" id="bubble-text"></div>
      <div class="bubble-tail"></div>
    </div>

    <div class="nameplate"><span id="blaze-name">Blaze</span> <span class="moodlabel" id="mood-label">is around</span></div>
  </div>

  <aside class="chat" id="chat">
    <header class="chat-head">
      <div class="who">
        <span class="dot" id="status-dot"></span>
        <div>
          <strong>Blaze</strong>
          <small id="chat-sub">thinking about you</small>
        </div>
      </div>
      <div class="head-btns">
        <button class="icon-btn" id="btn-settings" title="settings">⚙</button>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="quick" id="quick"></div>

    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="icon-btn mic" id="btn-mic" title="talk to Blaze">🎤</button>
      <input id="input" type="text" placeholder="say something to Blaze…" maxlength="400" />
      <button type="submit" class="send" id="btn-send" title="send">➤</button>
    </form>
  </aside>

  <div class="settings" id="settings" hidden>
    <div class="settings-card">
      <h2>how Blaze behaves</h2>
      <label class="row"><span>🔊 Voice</span><input type="checkbox" id="pref-voice" checked></label>
      <label class="row"><span>🎙️ Let Blaze listen (mic)</span><input type="checkbox" id="pref-mic"></label>
      <label class="row"><span>🔔 Nudge me with notifications</span><input type="checkbox" id="pref-notify"></label>
      <label class="row"><span>✨ Effects</span><input type="checkbox" id="pref-effects" checked></label>
      <label class="row slider"><span>💗 Spice level</span>
        <input type="range" id="pref-spice" min="0" max="2" step="1" value="1">
      </label>
      <div class="spice-legend"><span>sweet</span><span>flirty</span><span>extra</span></div>
      <label class="row"><span>🗣️ Voice pick</span><select id="pref-voicepick"></select></label>
      <label class="row slider"><span>💬 How much he talks</span>
        <input type="range" id="pref-chattiness" min="0" max="2" step="1" value="1">
      </label>
      <div class="spice-legend"><span>quiet</span><span>balanced</span><span>chatty</span></div>
      <div class="row memory">
        <span>🧠 Blaze remembers <b id="fact-count">0</b> things</span>
        <button class="icon-btn" id="btn-forget" title="forget everything">forget</button>
      </div>
      <button class="primary" id="btn-close-settings">done</button>
    </div>
  </div>

  <div class="debug" id="debug" hidden></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
